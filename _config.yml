# Site
title: ZhiYuan 的博客
subtitle: 保持热爱，持续进步
description: 一名大学生程序员的个人博客，分享编程学习、项目开发与技术探索
keywords: 编程, 博客, 大学生, 前端, Python, Java, 算法
author: ZhiYuan
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://1zzhiyuan.github.io
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter:
# 由 Butterfly 主题处理代码高亮

# Home page setting
index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 8
pagination_dir: page

theme: butterfly

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20

# Sitemap
sitemap:
  path: sitemap.xml

# Search
search:
  path: search.xml
  field: post
  content: true

deploy:
  type: ''
