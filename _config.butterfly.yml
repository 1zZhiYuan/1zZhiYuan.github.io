# ========== 水平分隔线 ==========
hr_icon:
  enable: true

# ========== 网站背景 ==========
background:

# ========== 鼠标指针样式 ==========
cursor:
  enable: false

# ========== APlayer 音乐播放器 ==========
aplayerInject:
  enable: true
  per_page: true
  # 歌单ID，可从 https://music.163.com 获取
  # 目前使用网易云音乐精选集
  playlist:
    - name: 网易云音乐精选
      server: netease
      type: playlist
      id: 3778678

# ========== 文章打赏 ==========
reward:
  enable: true
  QR_code:
    - img: /img/wechat-qr.png
      link:
      text: 微信
    - img: /img/alipay-qr.png
      link:
      text: 支付宝
  animation: true

# ========== 文章编辑提示 ==========
post_edit:
  enable: true
  url: https://github.com/1zZhiYuan/1zZhiYuan.github.io/tree/main/source/_posts/

# ========== 已读文章标记 ==========
readmode: true

# ========== 注入代码 ==========
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js"></script>

# ========== CDN ==========
cdn:
  prefix: https://cdn.jsdelivr.net/npm
